    // ==========================================
    // 6. FISHER-YATES SHUFFLE HELPER
    // ==========================================
    function fisherYatesShuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Safe Clipboard Helper (Works on GitHub Pages & Mobile WebViews)
    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (err) {}
        document.body.removeChild(textarea);
      }
    }

                    ].map((m) => (
                      <button
                        key={m.id}
                        onClick={() => setQuizMode(m.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 ${
                          quizMode === m.id
                            ? 'bg-violet-500 text-white shadow-md shadow-violet-500/25'
                            : 'bg-white/5 text-slate-300 hover:bg-white/10'
                        }`}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={handleRestartQuiz}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-violet-500/15 hover:bg-violet-500/25 text-xs font-bold text-violet-200 border border-violet-500/30 transition-all active:scale-95"
                  >
                    <Icons.Shuffle className="w-3.5 h-3.5 text-violet-400" />
                    <span>Перемешать вопросы и ответы</span>
                  </button>
                </div>

                {quizFinished ? (
                  <div className="rounded-3xl bg-white/[0.04] border border-white/15 p-6 sm:p-8 text-center space-y-5 backdrop-blur-xl">
                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 mx-auto flex items-center justify-center shadow-xl shadow-orange-500/25">
                      <Icons.Award className="w-9 h-9 text-slate-950" />
                    </div>

                    <div className="space-y-1">
                      <h2 className="text-2xl font-extrabold text-white">Раунд завершён! 🔥</h2>
                      <p className="text-sm text-slate-300">
                        Ты прошёл тест по направлению «{currentSubjectMeta.short}»
                      </p>
                    </div>

                    <div className="grid grid-cols-3 gap-3 max-w-md mx-auto">
                      <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10">
                        <div className="text-xl sm:text-2xl font-black text-emerald-400">
                          {quizSessionScore.correct}/{quizSessionScore.total}
                        </div>
                        <div className="text-[11px] text-slate-400">Верных ответов</div>
                      </div>
                      <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10">
                        <div className="text-xl sm:text-2xl font-black text-violet-400">
                          {quizSessionScore.total > 0
                            ? Math.round((quizSessionScore.correct / quizSessionScore.total) * 100)
                            : 0}
                          %
                        </div>
                        <div className="text-[11px] text-slate-400">Точность</div>
                      </div>
                      <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10">
                        <div className="text-xl sm:text-2xl font-black text-amber-400">
                          {stats.bestStreak} 🔥
                        </div>
                        <div className="text-[11px] text-slate-400">Лучший стрик</div>
                      </div>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                      <button
                        onClick={handleRestartQuiz}
                        className="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-violet-600/30"
                      >
                        <Icons.RotateCcw className="w-4 h-4" />
                        <span>Пройти ещё раз</span>
                      </button>
                      <button
                        onClick={() => setActiveTab('vault')}
                        className="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-bold text-sm flex items-center justify-center gap-2 border border-white/15"
                      >
                        <Icons.BookOpen className="w-4 h-4" />
                        <span>Открыть шпору с кодом</span>
                      </button>
                    </div>
                  </div>
                ) : currentQ ? (
                  <div className="rounded-3xl bg-white/[0.04] border border-white/10 p-4 sm:p-6 space-y-5 backdrop-blur-xl shadow-2xl">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between text-xs">
                        <span
                          className={`font-bold px-2.5 py-1 rounded-lg border ${
                            getSubjectBadge(currentQ.subject).badgeBg
                          }`}
                        >
                          {currentQ.topic}
                        </span>
                        <span className="font-bold text-slate-400">
                          Вопрос {currentQuestionIdx + 1} из {activeQuestions.length}
                        </span>
                      </div>
                      <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                        <div
                          className={`h-full bg-gradient-to-r ${currentSubjectMeta.gradient} transition-all duration-300`}
                          style={{
                            width: `${((currentQuestionIdx + 1) / activeQuestions.length) * 100}%`
                          }}
                        />
                      </div>
                    </div>

                    <h2 className="text-base sm:text-lg font-bold text-white leading-snug">
                      {currentQ.question}
                    </h2>

                    <div className="space-y-2.5">
                      {currentQ.options.map((opt, idx) => {
                        const isSelected = selectedOption === idx;
                        const isCorrectOption = idx === currentQ.correct;

                        let btnStyle =
                          'bg-white/[0.03] hover:bg-white/[0.07] border-white/10 text-slate-200';
                        if (isSubmitted) {
                          if (isCorrectOption) {
                            btnStyle =
                              'bg-emerald-500/20 border-emerald-500/60 text-emerald-100 shadow-lg shadow-emerald-500/10';
                          } else if (isSelected && !isCorrectOption) {
                            btnStyle = 'bg-rose-500/20 border-rose-500/60 text-rose-100';
                          } else {
                            btnStyle = 'bg-white/[0.01] border-white/5 text-slate-500 opacity-60';
                          }
                        }

                        return (
                          <button
                            key={idx}
                            onClick={() => handleOptionSelect(idx)}
                            disabled={isSubmitted}
                            className={`w-full text-left p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 flex items-start gap-3 ${btnStyle}`}
                          >
                            <div
                              className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 border ${
                                isSubmitted && isCorrectOption
                                  ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                                  : isSubmitted && isSelected && !isCorrectOption
                                  ? 'bg-rose-500 text-white border-rose-400'
                                  : 'bg-white/10 text-slate-300 border-white/10'
                              }`}
                            >
                              {isSubmitted && isCorrectOption ? (
                                <Icons.CheckCircle2 className="w-4 h-4" />
                              ) : isSubmitted && isSelected && !isCorrectOption ? (
                                <Icons.XCircle className="w-4 h-4" />
                              ) : (
                                idx + 1
                              )}
                            </div>
                            <span className="text-xs sm:text-sm font-medium leading-relaxed">
                              {opt}
                            </span>
                          </button>
                        );
                      })}
                    </div>

                    {isSubmitted && (
                      <div className="space-y-4 pt-2 animate-fadeIn">
                        <div
                          className={`p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed ${
                            selectedOption === currentQ.correct
                              ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-200'
                              : 'bg-amber-950/40 border-amber-500/30 text-amber-200'
                          }`}
                        >
                          <div className="font-extrabold mb-1 flex items-center gap-1.5">
                            <Icons.Sparkles className="w-4 h-4 shrink-0" />
                            <span>
                              {selectedOption === currentQ.correct
                                ? 'Идеально! +25 XP'
                                : 'Разбор ответа:'}
                            </span>
                          </div>
                          <p className="text-slate-200/90">{currentQ.explanation}</p>
                        </div>

                        <button
                          onClick={handleNextQuestion}
                          className={`w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r ${currentSubjectMeta.gradient} text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg hover:opacity-95 active:scale-[0.99] transition-all`}
                        >
                          <span>
                            {currentQuestionIdx + 1 < activeQuestions.length
                              ? 'Следующий вопрос'
                              : 'Завершить и посмотреть результат'}
                          </span>
                          <Icons.ArrowRight className="w-4 h-4" />
                        </button>
                      </div>
                    )}
                  </div>
                ) : null}
              </section>
            )}

            {/* MODE 2: FLASHCARDS */}
            {activeTab === 'cards' && currentCard && (
              <section className="space-y-4">
                <div className="flex items-center justify-between px-1">
                  <span className="text-xs font-bold text-slate-400">
                    Карточка {cardIndex + 1} из {activeCards.length}
                  </span>
                  <span className="text-xs font-semibold text-emerald-400">
                    Изучено: {Object.values(stats.masteredCards).filter(Boolean).length} /{' '}
                    {FLASHCARDS.length}
                  </span>
                </div>

                <div
                  onClick={() => setIsCardFlipped(!isCardFlipped)}
                  className="cursor-pointer select-none rounded-3xl bg-gradient-to-b from-white/[0.07] to-white/[0.02] border border-white/15 p-6 sm:p-8 min-h-[290px] sm:min-h-[320px] flex flex-col justify-between shadow-2xl relative overflow-hidden group transition-all hover:border-white/25"
                >
                  <div className="flex items-center justify-between gap-2">
                    <span
                      className={`text-[11px] font-bold px-2.5 py-1 rounded-lg border ${
                        getSubjectBadge(currentCard.subject).badgeBg
                      }`}
                    >
                      {currentCard.tag}
                    </span>
                    <span className="text-xs text-slate-400 flex items-center gap-1">
                      {isCardFlipped ? (
                        <>
                          <Icons.EyeOff className="w-3.5 h-3.5" /> Скрыть ответ
                        </>
                      ) : (
                        <>
                          <Icons.Eye className="w-3.5 h-3.5" /> Нажми, чтобы перевернуть
                        </>
                      )}
                    </span>
                  </div>

                  <div className="my-auto py-6">
                    {!isCardFlipped ? (
                      <div className="space-y-3 text-center">
                        <div className="text-xs uppercase tracking-widest text-violet-400 font-bold">
                          Вопрос билета
                        </div>
                        <h3 className="text-lg sm:text-xl font-extrabold text-white leading-snug">
                          {currentCard.front}
                        </h3>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <div className="text-xs uppercase tracking-widest text-emerald-400 font-bold">
                          Точный ответ / Синтаксис
                        </div>
                        <pre className="text-xs sm:text-sm font-mono text-slate-100 whitespace-pre-wrap bg-black/50 p-4 rounded-2xl border border-white/10 leading-relaxed overflow-x-auto">
                          {currentCard.back}
                        </pre>
                      </div>
                    )}
                  </div>

                  <div className="text-center text-[11px] text-slate-400">
                    {stats.masteredCards[currentCard.id]
                      ? '✅ Отмечено как изученное'
                      : 'Тапни по карточке для переворота'}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={() => handleCardMastery(false)}
                    className="py-3.5 px-4 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-200 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all active:scale-95"
                  >
                    <Icons.RotateCcw className="w-4 h-4 text-rose-400" />
                    <span>Повторить ещё</span>
                  </button>
                  <button
                    onClick={() => handleCardMastery(true)}
                    className="py-3.5 px-4 rounded-2xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-200 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all active:scale-95"
                  >
                    <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
                    <span>Изи, знаю! (+15 XP)</span>
                  </button>
                </div>
              </section>
            )}

            {/* MODE 3: CODE TRAINER */}
            {activeTab === 'code' && currentChallenge && (
              <section className="space-y-4">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-xs font-bold text-slate-400">
                    Задача {codeIndex + 1} из {activeCodeChallenges.length}
                  </span>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => setCodeShuffleSeed((s) => s + 1)}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-violet-500/15 hover:bg-violet-500/25 border border-violet-500/30 text-xs font-bold text-violet-200 transition-all active:scale-95"
                    >
                      <Icons.Shuffle className="w-3.5 h-3.5 text-violet-400" />
                      <span>Перемешать варианты</span>
                    </button>
                    <button
                      onClick={() => {
                        setSelectedCodeToken(null);
                        setShowCodeHint(false);
                        setCodeIndex(
                          (prev) =>
                            (prev - 1 + activeCodeChallenges.length) % activeCodeChallenges.length
                        );
                      }}
                      className="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10"
                    >
                      <Icons.ChevronLeft className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => {
                        setSelectedCodeToken(null);
                        setShowCodeHint(false);
                        setCodeIndex((prev) => (prev + 1) % activeCodeChallenges.length);
                      }}
                      className="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10"
                    >
                      <Icons.ChevronRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="rounded-3xl bg-white/[0.04] border border-white/10 p-4 sm:p-6 space-y-4 backdrop-blur-xl">
                  <div className="flex items-center justify-between gap-2">
                    <span
                      className={`text-xs font-bold px-2.5 py-1 rounded-lg border ${
                        getSubjectBadge(currentChallenge.subject).badgeBg
                      }`}
                    >
                      {currentChallenge.title}
                    </span>
                    {stats.solvedCodeIds[currentChallenge.id] && (
                      <span className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        <Icons.CheckCircle2 className="w-4 h-4" /> Решено
                      </span>
                    )}
                  </div>

                  <p className="text-xs sm:text-sm text-slate-200 font-medium leading-relaxed">
                    {currentChallenge.prompt}
                  </p>

                  <div className="rounded-2xl bg-[#050609] border border-white/15 overflow-hidden">
                    <div className="px-3.5 py-2 bg-white/[0.04] border-b border-white/10 flex items-center justify-between">
                      <div className="flex items-center gap-1.5">
                        <span className="w-2.5 h-2.5 rounded-full bg-rose-500/80" />
                        <span className="w-2.5 h-2.5 rounded-full bg-amber-500/80" />
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500/80" />
                      </div>
                      <span className="text-[11px] font-mono text-slate-400">
                        Вставь пропущенный фрагмент ___
                      </span>
                    </div>
                    <pre className="p-4 text-xs sm:text-sm font-mono text-cyan-200 overflow-x-auto leading-relaxed">
                      {currentChallenge.codeTemplate.replace(
                        '___',
                        selectedCodeToken ? `[ ${selectedCodeToken} ]` : '___'
                      )}
                    </pre>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    {currentChallenge.options.map((tok) => {
                      const isPicked = selectedCodeToken === tok;
                      const isRight = tok === currentChallenge.answer;

                      let style =
                        'bg-white/5 hover:bg-white/10 border-white/10 text-slate-200 font-mono';
                      if (isPicked) {
                        style = isRight
                          ? 'bg-emerald-500/25 border-emerald-400 text-emerald-200 font-mono shadow-lg shadow-emerald-500/15'
                          : 'bg-rose-500/25 border-rose-400 text-rose-200 font-mono';
                      }

                      return (
                        <button
                          key={tok}
                          onClick={() => handleCodeTokenSelect(tok)}
                          className={`p-3 rounded-xl border text-xs sm:text-sm font-bold transition-all ${style}`}
                        >
                          {tok}
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex items-center justify-between pt-2">
                    <button
                      onClick={() => setShowCodeHint(!showCodeHint)}
                      className="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1"
                    >
                      <Icons.HelpCircle className="w-3.5 h-3.5 text-amber-400" />
                      <span>{showCodeHint ? 'Скрыть подсказку' : 'Показать подсказку'}</span>
                    </button>

                    {selectedCodeToken === currentChallenge.answer && (
                      <button
                        onClick={() => {
                          setSelectedCodeToken(null);
                          setShowCodeHint(false);
                          setCodeIndex((prev) => (prev + 1) % activeCodeChallenges.length);
                        }}
                        className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs flex items-center gap-1.5"
                      >
                        <span>Дальше</span>
                        <Icons.ArrowRight className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>

                  {showCodeHint && (
                    <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200">
                      💡 {currentChallenge.hint}
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* MODE 4: REFERENCE VAULT */}
            {activeTab === 'vault' && (
              <section className="space-y-4">
                <div className="flex flex-col sm:flex-row gap-2.5">
                  <div className="relative flex-1">
                    <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Поиск по билетам, классам C#, C++, JS или SQL..."
                      className="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white/[0.05] border border-white/15 text-xs sm:text-sm text-white placeholder:text-slate-400 focus:outline-none focus:border-violet-400"
                    />
                  </div>

                  <div className="flex items-center gap-1.5 bg-white/[0.04] p-1.5 rounded-2xl border border-white/10 shrink-0">
                    {[
                      { id: 'all', label: 'Все' },
                      { id: 'theory', label: '📖 Теория' },
                      { id: 'code', label: '💻 Код и Практика' }
                    ].map((cat) => (
                      <button
                        key={cat.id}
                        onClick={() => setVaultCategory(cat.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          vaultCategory === cat.id
                            ? 'bg-violet-500 text-white'
                            : 'text-slate-300 hover:text-white'
                        }`}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-3">
                  {activeVaultItems.map((item) => {
                    const subjBadge = getSubjectBadge(item.subject);
                    return (
                      <div
                        key={item.id}
                        className="rounded-2xl bg-white/[0.04] border border-white/10 p-4 sm:p-5 space-y-3 hover:border-white/20 transition-all"
                      >
                        <div className="flex items-center justify-between gap-2 flex-wrap">
                          <div className="flex items-center gap-2">
                            <span
                              className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-md border ${subjBadge.badgeBg}`}
                            >
                              {subjBadge.short}
                            </span>
                            <span className="text-xs font-bold text-slate-400">{item.number}</span>
                          </div>

                          {item.code && (
                            <button
                              onClick={() => handleCopyCode(item.id, item.code)}
                              className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/15 text-xs font-semibold text-slate-200 border border-white/10 transition-all"
                            >
                              {copiedId === item.id ? (
                                <>
                                  <Icons.Check className="w-3.5 h-3.5 text-emerald-400" />
                                  <span className="text-emerald-300">Скопировано!</span>
                                </>
                              ) : (
                                <>
                                  <Icons.Copy className="w-3.5 h-3.5 text-slate-300" />
                                  <span>Скопировать код</span>
                                </>
                              )}
                            </button>
                          )}
                        </div>

                        <h3 className="text-sm sm:text-base font-extrabold text-white">
                          {item.title}
                        </h3>

                        <p className="text-xs sm:text-sm text-slate-300 whitespace-pre-line leading-relaxed">
                          {item.summary}
                        </p>

                        {item.code && (
                          <pre className="p-3.5 rounded-xl bg-[#050609] border border-white/10 text-xs font-mono text-emerald-300 overflow-x-auto leading-relaxed">
                            {item.code}
                          </pre>
                        )}
                      </div>
                    );
                  })}

                  {activeVaultItems.length === 0 && (
                    <div className="text-center py-12 text-slate-400 text-sm">
                      По запросу «{searchQuery}» ничего не найдено. Попробуй другой фильтр.
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 backdrop-blur-2xl bg-[#08090E]/90 border-t border-white/15 px-2 py-2">
            <div className="grid grid-cols-4 gap-1 max-w-md mx-auto">
              {[
                { id: 'quiz', label: 'Тест', icon: Icons.ListChecks },
                { id: 'cards', label: 'Карточки', icon: Icons.Layers },
                { id: 'code', label: 'Практика', icon: Icons.Terminal },
                { id: 'vault', label: 'Шпора', icon: Icons.BookOpen }
              ].map((item) => {
                const NavIcon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center justify-center py-2 rounded-2xl transition-all ${
                      isActive
                        ? `bg-gradient-to-r ${currentSubjectMeta.gradient} text-white shadow-lg`
                        : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <NavIcon className="w-5 h-5 mb-0.5" />
                    <span className="text-[11px] font-bold">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
